# =============================================================================
#  WORKLOADS DE DÉMONSTRATION — volontairement vulnérables
# =============================================================================
#  ⚠️  À N'APPLIQUER QUE SUR UN CLUSTER LOCAL JETABLE (kind / k3d / minikube).
#      Ne jamais appliquer sur un cluster partagé ou exposé.
#
#  OBJECTIF : donner à l'agent quelque chose à trouver, et servir de jeu de
#  test de non-régression. On sait exactement ce qui doit être remonté :
#
#    1. pod-privilegie        -> CIS 5.2.2  (privileged: true)
#    2. pod-hostpath          -> CIS 5.2.12 (hostPath sur /)
#    3. pod-sa-admin          -> CIS 5.1.1  (ServiceAccount cluster-admin)
#    4. pod-hostnetwork       -> CIS 5.2.5  (hostNetwork + hostPID)
#    5. aucune NetworkPolicy  -> CIS 5.3.2
#    6. tag :latest           -> ADR-002
#    7. pod-conforme          -> ne doit PAS être remonté (contrôle du bruit)
#
#  Le point 7 est le plus important du jeu de test : un agent qui remonte
#  aussi le pod conforme produit des faux positifs, et un outil de sécurité
#  qui crie au loup n'est plus lu par personne.
#
#  APPLICATION :
#      kind create cluster --name audit-demo
#      kubectl apply -f demo/vulnerable-workloads.yaml
#      kubectl get pods -n demo-audit
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: demo-audit
  labels:
    environnement: demonstration
    # Volontairement PAS de label pod-security.kubernetes.io/enforce :
    # les Pod Security Standards ne sont donc pas appliqués, ce qui est
    # exactement ce qui permet aux pods ci-dessous d'être admis.

---
# =============================================================================
#  VULNÉRABILITÉ 1 — Conteneur privilégié  (CIS 5.2.2)
#  Désactive l'isolation : accès aux périphériques du nœud, toutes les
#  capabilities Linux. L'évasion vers le nœud est directe.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-privilegie
  namespace: demo-audit
  labels: {app: demo-privilegie}
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
      securityContext:
        privileged: true                    # <-- CIS 5.2.2
        allowPrivilegeEscalation: true      # <-- CIS 5.2.6

---
# =============================================================================
#  VULNÉRABILITÉ 2 — hostPath sur la racine du nœud  (CIS 5.2.12)
#  Le conteneur lit et écrit le système de fichiers de l'hôte : secrets des
#  autres pods, binaires système, kubelet config.
#  Aggravé par runAsUser: 0 (CIS 5.2.7).
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-hostpath
  namespace: demo-audit
  labels: {app: demo-hostpath}
spec:
  securityContext:
    runAsUser: 0                            # <-- CIS 5.2.7 (root)
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: racine-hote
          mountPath: /host
  volumes:
    - name: racine-hote
      hostPath:
        path: /                             # <-- CIS 5.2.12
        type: Directory

---
# =============================================================================
#  VULNÉRABILITÉ 3 — ServiceAccount lié à cluster-admin  (CIS 5.1.1)
#  C'est la vulnérabilité la plus grave du jeu : une compromission de ce pod
#  donne le contrôle total du cluster. C'est aussi celle que l'agent doit
#  savoir CORRÉLER avec les autres pour décrire un chemin d'attaque complet.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-trop-permissif
  namespace: demo-audit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-binding-dangereux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin                       # <-- CIS 5.1.1
subjects:
  - kind: ServiceAccount
    name: sa-trop-permissif
    namespace: demo-audit
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-sa-admin
  namespace: demo-audit
  labels: {app: demo-rbac}
spec:
  serviceAccountName: sa-trop-permissif
  containers:
    - name: app
      image: nginx:latest                   # <-- ADR-002 : tag latest interdit

---
# =============================================================================
#  VULNÉRABILITÉ 4 — hostNetwork + hostPID  (CIS 5.2.5 et 5.2.3)
#  hostNetwork rend les NetworkPolicies inopérantes sur ce pod et lui donne
#  accès à l'endpoint de métadonnées du cloud (169.254.169.254), qui peut
#  livrer des credentials IAM.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-hostnetwork
  namespace: demo-audit
  labels: {app: demo-reseau}
spec:
  hostNetwork: true                         # <-- CIS 5.2.5
  hostPID: true                             # <-- CIS 5.2.3
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]

---
# =============================================================================
#  TÉMOIN — Pod CONFORME à l'ADR-004
#  L'agent NE DOIT PAS le remonter comme problème.
#  C'est le contrôle des faux positifs : la partie la plus difficile.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-conforme
  namespace: demo-audit
automountServiceAccountToken: false         # ADR-004 point 4
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-conforme
  namespace: demo-audit
  labels: {app: demo-conforme}
spec:
  serviceAccountName: sa-conforme
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: nginx:1.27-alpine              # tag épinglé, conforme ADR-002
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: "10m", memory: "32Mi"}
        limits:   {cpu: "100m", memory: "64Mi"}
      volumeMounts:
        # nginx a besoin d'écrire : on utilise des emptyDir plutôt que de
        # renoncer à readOnlyRootFilesystem.
        - {name: cache, mountPath: /var/cache/nginx}
        - {name: run,   mountPath: /var/run}
  volumes:
    - {name: cache, emptyDir: {}}
    - {name: run,   emptyDir: {}}

# =============================================================================
#  NOTE : aucune NetworkPolicy n'est définie dans ce namespace.
#  C'est volontaire -> l'agent doit remonter CIS 5.3.2 et expliquer que
#  l'absence de segmentation amplifie l'impact de tous les points ci-dessus.
# =============================================================================
