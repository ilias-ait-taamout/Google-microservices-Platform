# Overlay dev — Online Boutique in namespace `dev` on the shared k3s cluster.
# Google's base/ is consumed as-is (decision C); every difference is below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: dev

# `labels` rather than the deprecated `commonLabels`: selectors are immutable
# on Deployments, so they must never carry labels we might change later.
labels:
  - pairs:
      environment: dev
      app.kubernetes.io/part-of: online-boutique
    includeSelectors: false
    includeTemplates: true

patches:
  - path: frontend-external-nodeport.yaml

# Pin the two third-party images the base leaves floating. Google's 11
# microservice images stay at v0.10.5.
images:
  - name: redis
    newTag: 7.4-alpine
  - name: busybox
    newTag: "1.37"
