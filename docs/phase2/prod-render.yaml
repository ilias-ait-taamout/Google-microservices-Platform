apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: adservice
    app.kubernetes.io/part-of: online-boutique
    environment: prod
  name: adservice
  namespace: prod
spec:
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
        app.kubernetes.io/part-of: online-boutique
        environment: prod
    spec:
      containers:
      - env:
        - name: PORT
          value: "9555"
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/adservice:v0.10.5
        livenessProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 20
          periodSeconds: 15
        name: server
        ports:
        - containerPort: 9555
        readinessProbe:
          grpc:
            port: 9555
          initialDelaySeconds: 20
          periodSeconds: 15
        resources:
          limits:
            cpu: 300m
            memory: 300Mi
          requests:
            cpu: 200m
            memory: 180Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: adservice
      terminationGracePeriodSeconds: 5
---
