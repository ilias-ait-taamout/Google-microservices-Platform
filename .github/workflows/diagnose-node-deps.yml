# Diagnostic only - no change, no commit.
#
# The two Node services carry 61 blocking findings each, all from npm packages
# that are TRANSITIVE: protobufjs x24, brace-expansion x10, tar x9,
# minimatch x6. Fixing them means bumping whichever DIRECT dependency drags
# them in, and guessing which one has already cost enough time elsewhere in
# this phase.
#
# Every dependency in package.json is pinned to an exact version, with no
# caret, so `npm update` would do nothing: it never leaves the declared range
# and there is no range. The direct dependency has to be named - which is why
# its identity is the thing worth establishing first.
#
# Output goes to ::notice annotations as well as the step summary, because
# annotations are readable through the public GitHub API for a public
# repository while logs, summaries and artifacts all need credentials.
#
# Delete once the Node family is fixed.
name: diagnose-node-deps

on:
  push:
    branches: [feature/phase3-cicd]
    paths:
      - '.github/workflows/diagnose-node-deps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [currencyservice, paymentservice]
    name: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match the builder image, node:20.20.2-alpine. Resolving a tree on a
          # different major can pick different versions and make the diagnosis
          # describe a tree the image never builds.
          node-version: '20'

      - name: Install, the way the image does
        working-directory: src/${{ matrix.service }}
        run: |
          # The Dockerfile runs `npm install --only=production`, NOT `npm ci`.
          # `npm ci` is strict: it refuses when package-lock.json and
          # package.json disagree, which is a different question from the one
          # being asked here. The first version of this step used it and failed
          # for that reason.
          set +e
          npm install --omit=dev 2>&1 | tee /tmp/npm.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # A diagnostic step that fails without saying why is worthless -
            # that is exactly what happened on the first attempt. Push the
            # reason out through annotations, which the API can read.
            grep -iE 'npm (error|ERR)|EUSAGE|ERESOLVE' /tmp/npm.log | head -8 \
              | while IFS= read -r l; do echo "::error title=NpmInstall::$l"; done
            tail -3 /tmp/npm.log | while IFS= read -r l; do echo "::error title=NpmTail::$l"; done
            exit 1
          fi

      - name: Who pulls the vulnerable packages?
        working-directory: src/${{ matrix.service }}
        run: |
          set -uo pipefail
          {
            echo "### ${{ matrix.service }}"
            for pkg in protobufjs brace-expansion tar minimatch linkify-it; do
              echo ""
              echo "#### $pkg"
              echo '```'
              npm ls "$pkg" --all 2>&1 | head -40
              echo '```'
            done
            echo ""
            echo "#### npm outdated (direct dependencies)"
            echo '```'
            npm outdated 2>&1 | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The compact version, as annotations: for each vulnerable package,
          # the top-level dependency it hangs from. `npm ls --parseable` prints
          # paths under node_modules; the first segment after the first
          # node_modules/ is the direct dependency responsible.
          for pkg in protobufjs brace-expansion tar minimatch linkify-it; do
            npm ls "$pkg" --all --parseable 2>/dev/null \
              | sed "s#^$PWD/node_modules/##" \
              | awk -F'/node_modules/' 'NF>1 {print $1}' \
              | sort -u | head -4 \
              | while read -r owner; do
                  [ -n "$owner" ] && echo "::notice title=NodeDep::$pkg <- $owner"
                done
          done

          echo "--- npm outdated, machine readable ---"
          npm outdated --json 2>/dev/null \
            | jq -r 'to_entries[] | "::notice title=NodeOutdated::\(.key) \(.value.current) -> \(.value.latest)"' \
            | head -20 || true
