# Maintenance workflow: raise the Go services' vulnerable dependencies and
# commit the result.
#
# Why it exists. The Trivy gate blocks on findings that all carry a fix
# upstream, and doing the bump needs a Go toolchain with a reachable module
# proxy. A runner has both; the laptop did not.
#
# Deliberately NOT part of the pipeline: a dependency bump is a decision, not
# something a build should do behind your back. It runs when you push a change
# to this file, and the commit it makes then triggers build-push for the rescan
# - which is the point.
#
# Dependabot is the proper long-term answer. Remove or replace this at task 22.
name: bump-go-deps

on:
  push:
    branches: [feature/phase3-cicd]
    # Only its own file. A change to go.mod must not retrigger it, or it loops.
    paths:
      - '.github/workflows/bump-go-deps.yml'
  workflow_dispatch:

# This one DOES need write access - the exception, and the reason it is a
# separate file from build-push.yml rather than another job inside it.
permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    # Sequential on purpose. Each job commits and pushes to the same branch;
    # in parallel they would race and all but one would be rejected.
    concurrency: bump-go-deps
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        service: [checkoutservice, productcatalogservice, shippingservice]

    name: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Matches the builder image the Dockerfiles pin. The stdlib findings
          # are fixed by the toolchain, not by any module.
          go-version: '1.26.9'
          cache-dependency-path: src/${{ matrix.service }}/go.sum

      - name: Raise the four vulnerable modules
        working-directory: src/${{ matrix.service }}
        run: |
          set -euxo pipefail
          # x/crypto, x/net and x/text are INDIRECT in most of these services,
          # so nothing pulls them forward on its own - they must be named.
          go get -u \
            golang.org/x/crypto \
            golang.org/x/net \
            golang.org/x/text \
            google.golang.org/grpc
          go mod tidy
          # Fail here rather than three minutes later in the image build if the
          # grpc 1.79 -> 1.8x jump broke an API.
          go build ./...
          echo "--- resulting versions ---"
          go list -m golang.org/x/crypto golang.org/x/net golang.org/x/text google.golang.org/grpc

      - name: Commit and push
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          # Another matrix leg may have pushed since checkout.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          if git diff --quiet -- "src/$SERVICE/go.mod" "src/$SERVICE/go.sum"; then
            echo "$SERVICE: already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/$SERVICE/go.mod" "src/$SERVICE/go.sum"
          git commit -m "fix($SERVICE): raise x/crypto, x/net, x/text and grpc past the Trivy gate" \
                     -m "Automated by .github/workflows/bump-go-deps.yml. Every finding was HIGH with a fix available upstream, so --ignore-unfixed filtered none. The stdlib share is handled separately by the builder image bump to golang 1.26.9."
          git push
          {
            echo "### $SERVICE"
            echo '```'
            git show --stat --oneline HEAD | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
