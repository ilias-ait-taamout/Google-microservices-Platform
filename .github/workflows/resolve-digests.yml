# Workflow JETABLE — à supprimer à la tâche 22, comme les trois autres.
#
# Pourquoi il existe : les Dockerfiles épinglent leurs images de base par
# digest, et le registre Docker Hub, le registre Microsoft et Maven Central ne
# sont joignables depuis aucun environnement de travail. Le runner GitHub, lui,
# y accède. Il résout, et renvoie le résultat en `::notice` — la seule sortie
# de CI que l'API publique sert sans identifiant.
#
# En lecture seule : il inspecte des manifestes et liste des versions, il ne
# construit et ne publie rien.
name: resolve-digests

on:
  push:
    branches: [feature/phase3-cicd]
    paths:
      - '.github/workflows/resolve-digests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # -----------------------------------------------------------------------
      # .NET — cartservice reste bloqué sur openssl/libssl3t64 dans
      # runtime-deps:10.0.0-noble-chiseled. Le digest de CE tag n'a pas bougé
      # (vérifié), donc il faut un tag plus récent, pas le même rafraîchi.
      # -----------------------------------------------------------------------
      - name: Which dotnet runtime-deps tags exist?
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -sS "https://mcr.microsoft.com/v2/dotnet/runtime-deps/tags/list" \
            | jq -r '.tags[]' \
            | grep -E '^10\.[0-9]+(\.[0-9]+)?-noble-chiseled$' \
            | sort -V | tail -8 \
            | while read -r t; do echo "::notice title=DotnetTag::$t"; done

      # -----------------------------------------------------------------------
      # Java — netty est tiré transitivement par io.grpc:grpc-netty. Trivy
      # annonce des correctifs dans DEUX lignes (4.1.136 et 4.2.16/4.2.17) et
      # les mélanger, ou forcer 4.2 sous un gRPC-Java épinglé sur 4.1, expose à
      # une panne à l'exécution qui compile proprement. On relève donc d'abord
      # ce qui existe réellement, et quelle ligne gRPC 1.80.0 attend.
      # -----------------------------------------------------------------------
      - name: What netty versions exist, and which one does gRPC expect?
        continue-on-error: true
        run: |
          set -uo pipefail
          for A in netty-codec netty-codec-http netty-codec-http2 netty-handler; do
            curl -sS "https://repo1.maven.org/maven2/io/netty/$A/maven-metadata.xml" \
              | grep -oE '<version>[^<]+</version>' | sed 's/<[^>]*>//g' \
              | grep -E '^4\.(1|2)\.[0-9]+\.Final$' | sort -V | tail -2 \
              | while read -r v; do echo "::notice title=Netty::$A $v"; done
          done

          # La version de netty que gRPC 1.80.0 déclare lui-même : c'est elle
          # qui dit quelle ligne est sûre, et non le plus haut numéro existant.
          curl -sS "https://repo1.maven.org/maven2/io/grpc/grpc-netty/1.80.0/grpc-netty-1.80.0.pom" \
            | tr -d '\n' | grep -oE '<artifactId>netty-[^<]+</artifactId>[^!]{0,200}?<version>[^<]+</version>' \
            | sed 's/<[^>]*>/ /g' | tr -s ' ' \
            | while read -r line; do echo "::notice title=GrpcNetty::$line"; done

          # Et la version de jackson qu'on vient d'épingler existe-t-elle ?
          for V in 2.21.7; do
            C=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/$V/jackson-databind-$V.pom")
            echo "::notice title=Jackson::jackson-databind $V -> HTTP $C"
          done

      - name: Resolve the digests we pin
        continue-on-error: true
        run: |
          set -uo pipefail
          # Le digest de l'INDEX, pas celui d'une plateforme : c'est lui qui va
          # dans un FROM et reste valable quelle que soit l'architecture.
          #
          # Comparer le résultat à ce que le Dockerfile épingle est un contrôle
          # en soi : eclipse-temurin:25.0.4.1_1-jre-alpine avait BOUGÉ sous le
          # même tag, ce qui est exactement la raison d'épingler par digest.
          for REF in \
            "golang:1.26.10-alpine" \
            "python:3.14.8-alpine" \
            "alpine:3.23.6" \
            "eclipse-temurin:25.0.4.1_1-jre-alpine" \
            "mcr.microsoft.com/dotnet/runtime-deps:10.0.0-noble-chiseled" \
            "mcr.microsoft.com/dotnet/runtime-deps:10.0.1-noble-chiseled" \
            "mcr.microsoft.com/dotnet/sdk:10.0.100-noble"
          do
            D=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
            echo "::notice title=Digest::$REF@${D:-INTROUVABLE}"
          done
